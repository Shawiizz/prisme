[package]
name = "prisme-desktop"
description = "Prisme desktop application (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "prisme_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prisme-timecode.workspace = true
prisme-media.workspace = true
prisme-engine.workspace = true
prisme-audio-io.workspace = true
prisme-analysis.workspace = true
prisme-library.workspace = true
prisme-session.workspace = true
prisme-import.workspace = true
prisme-control.workspace = true
midir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
notify.workspace = true
hound.workspace = true
chrono.workspace = true
rtrb.workspace = true
