[package]
name = "prisme-desktop"
description = "Prisme desktop application (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "prisme_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prisme-timecode.workspace = true
prisme-media.workspace = true
prisme-engine.workspace = true
prisme-audio-io.workspace = true
prisme-analysis.workspace = true
prisme-library.workspace = true
prisme-session.workspace = true
prisme-import.workspace = true
prisme-control.workspace = true
prisme-actions.workspace = true
prisme-stems.workspace = true
prisme-update.workspace = true
midir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
notify.workspace = true
hound.workspace = true
chrono.workspace = true
rtrb.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
dirs = "7"
rayon = "1"

[dev-dependencies]
prisme-engine = { workspace = true, features = ["testing"] }
prisme-actions = { workspace = true, features = ["ts"] }
prisme-library = { workspace = true, features = ["ts"] }
ts-rs.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
hidapi = "2.6"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
webpki-root-certs = "1"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSDragging", "NSPasteboard", "NSPasteboardItem", "NSResponder", "NSView"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
windows-sys = { workspace = true, features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
