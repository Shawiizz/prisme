[package]
name = "prisme-desktop"
description = "Prisme desktop application (Tauri v2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "prisme_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prisme-timecode.workspace = true
prisme-media.workspace = true
prisme-engine.workspace = true
prisme-audio-io.workspace = true
prisme-analysis.workspace = true
prisme-library.workspace = true
prisme-session.workspace = true
prisme-import.workspace = true
prisme-control.workspace = true
prisme-stems.workspace = true
midir.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
percent-encoding.workspace = true
notify.workspace = true
hound.workspace = true
chrono.workspace = true
rtrb.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
dirs = "7"
rayon = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading"] }
