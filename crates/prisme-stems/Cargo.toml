[package]
name = "prisme-stems"
description = "Stem separation with Mel-Band RoFormer networks, on the GPU or the CPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
prisme-media.workspace = true
realfft.workspace = true
thiserror.workspace = true
safetensors = "0.8"
memmap2 = "0.9"
gemm = "0.19"
rayon = "1"
libm = "0.2"
half = { version = "2", features = ["bytemuck"] }
flacenc = "0.5"
rubato = "5"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl"] }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

# the graphics APIs of each system; on Windows, DXC is linked in to compile the shaders of
# DirectX 12 (FXC takes minutes)
[target.'cfg(windows)'.dependencies]
wgpu = { version = "30", default-features = false, features = ["dx12", "static-dxc", "vulkan"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"] }

[dev-dependencies]
hound.workspace = true
