[package]
name = "prisme-audio-io"
description = "Sound card input/output behind a small, backend-independent interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
cpal = { workspace = true, features = ["realtime"] }
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "android")'.dependencies]
ndk = { version = "0.9", features = ["audio"] }

[target.'cfg(windows)'.dependencies]
cpal = { workspace = true, features = ["realtime", "asio"] }
# the version cpal uses: one copy of the bindings
windows = { version = "0.62", features = [
    "Win32_Devices_Properties",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = { workspace = true, features = ["realtime", "jack"] }
