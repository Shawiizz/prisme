@if (PHONE) {
  <!-- loaded apart: a computer never needs the screens of a phone -->
  @defer (on immediate) {
    <app-phone />
  }
} @else {
  <app-titlebar />

  <main
    class="layout"
    [class.split]="under() !== null"
    [style.--under.px]="under()"
    [style.--under-zoom]="underZoom()"
  >
    @if (under() !== null) {
      <app-now-playing />
    }
    <section class="decks" [class.mix]="mixer.internal()" [class.compact]="compact()">
      @for (deck of decks(); track deck) {
        <app-deck-lane [deck]="deck" [compact]="compact()" />
        @if (deck === 0) {
          <app-phase-strip />
        }
      }
    </section>

    <section class="library">
      <app-library />
    </section>
  </main>
}

<!-- loaded when first opened -->
@if (!PHONE && navigation.settings()) {
  @defer (on immediate) {
    <app-settings-dialog />
  }
}

@if (!PHONE && navigation.palette()) {
  @defer (on immediate) {
    <app-command-palette />
  }
}

<app-select-picker />
<app-confirm />
@if (!PHONE) {
  <app-tooltip />
}
