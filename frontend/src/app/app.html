<app-titlebar
  (openSettings)="settingsOpen.set(true)"
  (openTurntables)="turntablesOpen.set(true)"
  (openShortcuts)="keyboard.helpOpen.set(true)"
/>

<main class="layout">
  <section class="decks">
    @for (d of [0, 1]; track d) {
      <div class="deck-row">
        <app-deck-card [deck]="d" />
        <app-deck-waveform [deck]="d" />
      </div>
    }
  </section>

  <section class="controls">
    <app-deck-controls class="left" [deck]="0" />
    <app-mixer class="mixer" />
    <app-deck-controls class="right" [deck]="1" />
    <app-deck-pads class="left" [deck]="0" />
    <app-deck-pads class="right" [deck]="1" />
  </section>

  <section class="library">
    <app-library />
  </section>
</main>

@if (settingsOpen()) {
  <app-settings-dialog (closed)="settingsOpen.set(false)" />
}

@if (keyboard.helpOpen()) {
  <app-shortcuts-dialog />
}

@if (turntablesOpen()) {
  <app-turntables-dialog (closed)="turntablesOpen.set(false)" />
}
