@if (PHONE) {
  <!-- loaded apart: a computer never needs the screens of a phone -->
  @defer (on immediate) {
    <app-phone />
  }
} @else {
  <app-titlebar />

  <main class="layout">
    <section class="decks" [class.mix]="mixer.internal()" [class.four]="decks().length > 2">
      @for (deck of decks(); track deck) {
        <app-deck-lane [deck]="deck" [compact]="decks().length > 2" />
        @if (deck === 0) {
          <app-phase-strip />
        }
      }
    </section>

    <section class="library">
      <app-library />
    </section>
  </main>
}

<!-- loaded when first opened -->
@if (!PHONE && navigation.settings()) {
  @defer (on immediate) {
    <app-settings-dialog />
  }
}

@if (!PHONE && navigation.palette()) {
  @defer (on immediate) {
    <app-command-palette />
  }
}
