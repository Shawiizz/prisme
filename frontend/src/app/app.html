<app-titlebar />

<main class="layout">
  <section class="decks" [class.mix]="mixer.internal()">
    <app-deck-lane [deck]="0" />
    <app-phase-strip />
    <app-deck-lane [deck]="1" />
  </section>

  <section class="library">
    <app-library />
  </section>
</main>

@if (navigation.settings()) {
  <app-settings-dialog />
}

@if (navigation.palette()) {
  <app-command-palette />
}
