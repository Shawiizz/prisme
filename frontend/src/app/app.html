<app-titlebar
  (openSettings)="settingsOpen.set(true)"
  (openTurntables)="turntablesOpen.set(true)"
  (openShortcuts)="controls.helpOpen.set(true)"
  (openControllers)="controllersOpen.set(true)"
/>

<main class="layout">
  <section class="decks">
    <div class="deck-row">
      <app-deck-card [deck]="0" />
      <app-deck-waveform [deck]="0" />
    </div>
    <app-phase-strip />
    <div class="deck-row">
      <app-deck-card [deck]="1" />
      <app-deck-waveform [deck]="1" />
    </div>
  </section>

  <section class="controls">
    <app-deck-controls class="left" [deck]="0" />
    <app-mixer class="mixer" />
    <app-deck-controls class="right" [deck]="1" />
    <app-deck-pads class="left" [deck]="0" />
    <app-deck-pads class="right" [deck]="1" />
  </section>

  <section class="library">
    <app-library />
  </section>
</main>

@if (settingsOpen()) {
  <app-settings-dialog (closed)="settingsOpen.set(false)" />
}

@if (controls.helpOpen()) {
  <app-shortcuts-dialog />
}

@if (controllersOpen()) {
  <app-controllers-dialog (closed)="controllersOpen.set(false)" />
}

@if (turntablesOpen()) {
  <app-turntables-dialog (closed)="turntablesOpen.set(false)" />
}
