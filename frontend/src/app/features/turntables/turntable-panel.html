<div class="panel" [style.--accent]="color()">
  <h3><span class="tile">{{ deck() + 1 }}</span> Turntable {{ deck() + 1 }}</h3>

  <canvas #scope class="scope" [width]="size" [height]="size" [style.--accent-color]="color()"></canvas>

  <div class="readings">
    <div>
      <span class="label">Signal</span>
      <span class="value" [class]="vinyl()?.signal ?? 'none'">{{ vinyl()?.signal ?? 'none' }}</span>
    </div>
    <div>
      <span class="label">Level</span>
      <div class="bar"><div [style.width.%]="levelPercent()"></div></div>
    </div>
    <div>
      <span class="label">Speed</span>
      <span class="value">{{ speed() }}</span>
    </div>
    <div>
      <span class="label">Record</span>
      <span class="value">{{ position() }}</span>
    </div>
  </div>

  <div class="controls">
    <label class="check">
      <input type="checkbox" [checked]="settings().vinylEnabled" (change)="setEnabled($any($event.target).checked)" />
      <span>Vinyl control</span>
    </label>
    <div class="modes">
      <button [class.active]="settings().vinylMode === 'absolute'" (click)="setMode('absolute')" title="The needle position is the track position">ABS</button>
      <button [class.active]="settings().vinylMode === 'relative'" (click)="setMode('relative')" title="Only the speed: cues, loops and sync work">REL</button>
    </div>
    <label>
      <span class="label">Lead-in (s)</span>
      <input type="number" min="0" step="0.5" [value]="settings().leadInS" (change)="setLeadIn($event)" title="Where the track starts on the record" />
    </label>
    <label class="check">
      <input type="checkbox" [checked]="settings().swapChannels" (change)="setSwap($any($event.target).checked)" />
      <span>Swap left / right</span>
    </label>
  </div>
</div>
