<div class="mixer">
  @if (internal()) {
    <div class="channels">
      @for (d of deckIndexes; track d) {
        <div class="channel" [style.--accent]="color(d)">
          <span class="label">{{ d + 1 }}</span>
          <div class="fader-row">
            <input
              class="fader"
              type="range"
              min="0"
              max="1"
              step="0.01"
              [value]="engine.decks()[d].volume"
              (input)="onVolume(d, $event)"
            />
            <div class="meter"><div [style.height.%]="deckPeak(d) * 100"></div></div>
          </div>
          <button
            class="cue"
            [class.active]="engine.decks()[d].cue"
            (click)="mixer.setDeckCue(d, !engine.decks()[d].cue)"
            title="Hear this deck in the headphones"
          >
            CUE
          </button>
        </div>
      }
      <div class="master" title="Master">
        <span class="label">M</span>
        <div class="meter"><div [style.height.%]="peak() * 100" [class.clip]="peak() > 0.99"></div></div>
      </div>
    </div>
    <div class="headphones">
      <span class="label" title="Headphones: cued decks or master">CUE</span>
      <input type="range" min="0" max="1" step="0.01" [value]="mixer.cueMix()" (input)="onCueMix($event)" />
      <span class="label">MST</span>
      <input
        class="gain"
        type="range"
        min="0"
        max="1.5"
        step="0.01"
        [value]="mixer.headphoneGain()"
        (input)="onHeadphoneGain($event)"
        title="Headphone volume"
      />
    </div>
    <input
      class="crossfader"
      type="range"
      min="-1"
      max="1"
      step="0.01"
      [value]="mixer.crossfader()"
      (input)="onCrossfader($event)"
      (dblclick)="mixer.setCrossfader(0)"
    />
  } @else {
    <div class="external">
      <span class="label">External mixer</span>
      <div class="sends">
        @for (d of deckIndexes; track d) {
          <div class="send" [style.--accent]="color(d)">
            <div class="meter"><div [style.height.%]="deckPeak(d) * 100"></div></div>
            <span class="deck">{{ d + 1 }}</span>
            <span class="out">OUT {{ outputs(d) }}</span>
          </div>
        }
      </div>
    </div>
  }
  @if (fallback()) {
    <div class="warning" title="Each deck needs its own pair of outputs">External mixer needs 4 outputs</div>
  }
</div>
