<div class="backdrop" (click)="closed.emit()">
  <div class="dialog" (click)="$event.stopPropagation()" (keydown.escape)="closed.emit()">
    <h2>{{ crate() ? ('Smart crate' | t) : ('New smart crate' | t) }}</h2>
    <input
      class="name"
      [placeholder]="'Name' | t"
      [value]="name()"
      (input)="name.set($any($event.target).value)"
    />
    <div class="match">
      {{ 'Tracks matching' | t }}
      <select
        [value]="matchAll() ? 'all' : 'any'"
        (change)="matchAll.set($any($event.target).value === 'all')"
      >
        <option value="all">{{ 'all of these rules' | t }}</option>
        <option value="any">{{ 'any of these rules' | t }}</option>
      </select>
    </div>
    <div class="rules">
      @for (r of rules(); track $index; let i = $index) {
        <div class="rule">
          <select [value]="choiceOf(r)" (change)="setChoice(i, $any($event.target).value)">
            @for (c of choices; track c.id) {
              <option [value]="c.id">{{ c.label }}</option>
            }
          </select>
          @if (r.kind === 'text') {
            <span>{{ 'contains' | t }}</span>
            <input
              class="grow"
              [value]="r.contains"
              (input)="setContains(i, $any($event.target).value)"
            />
          } @else if (r.kind === 'key') {
            <span>{{ 'is one of' | t }}</span>
            <input
              class="grow"
              placeholder="8A 9A 8B"
              [value]="r.camelot.join(' ')"
              (change)="setKeys(i, $any($event.target).value)"
            />
          } @else {
            <span>{{ 'from' | t }}</span>
            <input
              class="bound"
              inputmode="decimal"
              [value]="r.min ?? ''"
              (change)="setBound(i, 'min', $any($event.target).value)"
            />
            <span>{{ 'to' | t }}</span>
            <input
              class="bound"
              inputmode="decimal"
              [value]="r.max ?? ''"
              (change)="setBound(i, 'max', $any($event.target).value)"
            />
          }
          <button class="remove" [title]="'Remove this rule' | t" (click)="remove(i)">×</button>
        </div>
      }
    </div>
    <div class="buttons">
      <button (click)="add()">{{ 'Add a rule' | t }}</button>
      <span class="spacer"></span>
      <button (click)="closed.emit()">{{ 'Cancel' | t }}</button>
      <button class="primary" [disabled]="!name().trim() || !rules().length" (click)="save()">
        {{ crate() ? ('Save' | t) : ('Create' | t) }}
      </button>
    </div>
  </div>
</div>
