<section class="library">
  <app-library-sidebar />

  <div class="tracks">
    <div class="toolbar">
      <div class="scope" role="group" aria-label="Search in">
        <button [class.active]="library.scope() === 'list'" (click)="library.setScope('list')">
          {{ listLabel() }}
        </button>
        <button
          [class.active]="library.scope() === 'library'"
          (click)="library.setScope('library')"
        >
          Library
        </button>
      </div>
      <input
        #search
        type="search"
        [placeholder]="
          library.scope() === 'list'
            ? 'Search in this ' + listLabel().toLowerCase()
            : 'Search the whole library'
        "
        [value]="library.filter()"
        (input)="library.setFilter($any($event.target).value)"
        (keydown.escape)="search.blur()"
      />
      <span class="count"
        >{{ tracks().length }} {{ tracks().length === 1 ? 'track' : 'tracks' }}</span
      >
      @if (engine.error() ?? library.error(); as e) {
        <span class="error" [title]="e">{{ e }}</span>
      }
      <div class="analysis">
        @if (progress().running) {
          <span class="status">Analysing {{ progress().done }} / {{ progress().total }}</span>
          <div class="bar"><div [style.width.%]="progressPercent()"></div></div>
        } @else if (progress().failed > 0) {
          <span class="status" title="Files that could not be decoded"
            >{{ progress().failed }} unreadable</span
          >
        }
        <button
          class="ghost"
          (click)="library.rescan()"
          [disabled]="progress().running"
          title="Analyse new and changed files"
        >
          Rescan
        </button>
      </div>
    </div>
    <app-track-table />
  </div>
</section>
