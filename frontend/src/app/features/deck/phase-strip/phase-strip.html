<div class="info">
  <span class="pr-label">{{ 'Phase' | t }}</span>
  <span class="offset">{{ offset() }}</span>
  @if (drift(); as drift) {
    <span class="drift">{{ drift }}</span>
  }
</div>
<div class="lane"><canvas #lane></canvas></div>
@if (mixer.internal()) {
  <div class="crossfade pr-panel">
    <span class="pr-label">A</span>
    <app-fader
      centered
      [min]="-1"
      [max]="1"
      [value]="mixer.crossfader()"
      (valueChange)="mixer.setCrossfader($event)"
      [label]="'Crossfader' | t"
    />
    <span class="pr-label">B</span>
    <app-mixer-menu />
  </div>
}
