<div class="card">
  <div class="tile">{{ deck() + 1 }}</div>
  @if (track(); as t) {
    <app-cover class="cover" [path]="t.path" />
  }

  <div class="body">
    <div class="row">
      @if (track(); as t) {
        <span class="title">{{ t.title }}</span>
        <span class="time">{{ remaining() }}</span>
      } @else if (loading()) {
        <span class="empty">{{ 'LOADING…' | t }}</span>
      } @else {
        <span class="empty">{{ 'NO TRACK LOADED' | t }}</span>
      }
    </div>
    <div class="row sub">
      <span class="artist">{{ track()?.artist ?? '' }}</span>
      @if (track()) {
        <span class="elapsed">{{ elapsed() }}</span>
      }
    </div>

    <div class="divider"></div>

    <div class="row stats">
      <button
        class="analysis"
        [disabled]="!track()"
        [title]="'Beat grid, key and key shift' | t"
        (click)="editing.set(!editing())"
      >
        <div class="stat">
          <span class="label" [class.edited]="track()?.gridEdited">BPM</span>
          <span class="value">{{ bpm() ?? '—' }}</span>
        </div>
        <div class="stat">
          <span class="label" [class.edited]="track()?.keyEdited" [class.shifted]="keyShifted()"
            >KEY</span
          >
          @if (key(); as k) {
            <span class="value"
              >{{ k.camelot }}<span class="key-name">{{ k.name }}</span></span
            >
          } @else {
            <span class="value">—</span>
          }
        </div>
      </button>
      <div class="stat">
        <span class="label">PITCH</span>
        <span class="value small">{{ pitch() }}</span>
      </div>

      <div class="vinyl">
        <span class="signal" [class]="signal()" [title]="signalTitle()"></span>
        <button [class.active]="settings().vinylEnabled" (click)="toggleVinyl()">VINYL</button>
        <button [class.active]="settings().vinylEnabled" (click)="toggleMode()">
          {{ settings().vinylMode === 'absolute' ? 'ABS' : 'REL' }}
        </button>
      </div>
    </div>
  </div>
</div>
@if (editing() && track()) {
  <app-grid-editor [deck]="deck()" (closed)="editing.set(false)" />
}
