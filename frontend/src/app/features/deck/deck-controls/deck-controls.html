<div class="controls pr-panel">
  <div class="transport">
    <button
      class="pr-btn pr-btn--lg"
      [class.is-on]="status()?.playing === false && status()?.loaded"
      [disabled]="vinyl()"
      (pointerdown)="cueDown()"
      (pointerup)="cueUp()"
      (pointercancel)="cueUp()"
    >
      CUE
    </button>
    <button
      class="pr-btn pr-btn--lg"
      [class.is-on]="status()?.playing"
      (click)="togglePlay()"
      [disabled]="vinyl()"
    >
      {{ status()?.playing ? 'PAUSE' : 'PLAY' }}
    </button>
    <button
      class="pr-btn pr-btn--lg sync"
      [class.is-on]="syncState() === 'locked'"
      [class.matched]="syncState() === 'matched'"
      (click)="sync()"
      [disabled]="!canSync()"
      [title]="syncTitle()"
    >
      SYNC
    </button>
  </div>

  <div class="tempo">
    <div class="tempo-head">
      <span class="pr-label">Tempo</span>
      <button
        class="pr-btn pr-btn--sm"
        [class.is-on]="settings().keyLock"
        (click)="engine.setKeyLock(deck(), !settings().keyLock)"
        [title]="'Key lock: the pitch stays when the tempo changes' | t"
      >
        KEY
      </button>
      @if (status()?.sync?.leader) {
        <span class="pr-chip" [title]="'The other decks follow this one' | t">LEADER</span>
      }
      <span class="value pr-num" (dblclick)="resetPitch()" [title]="'Double-click to reset' | t">{{
        pitchText()
      }}</span>
    </div>
    <div class="fader">
      <button
        class="pr-btn pr-btn--sm pr-btn--icon"
        [title]="'Slow down while held' | t"
        [attr.aria-label]="'Slow down while held' | t"
        [disabled]="tempoFaderLocked()"
        (pointerdown)="bend(-1)"
        (pointerup)="bend(0)"
        (pointercancel)="bend(0)"
      >
        −
      </button>
      <input
        class="pr-range"
        type="range"
        [min]="-range()"
        [max]="range()"
        step="0.0005"
        [value]="faderValue()"
        (input)="onPitch($event)"
        (dblclick)="resetPitch()"
        [disabled]="tempoFaderLocked()"
        [attr.aria-label]="'Tempo' | t"
      />
      <button
        class="pr-btn pr-btn--sm pr-btn--icon"
        [title]="'Speed up while held' | t"
        [attr.aria-label]="'Speed up while held' | t"
        [disabled]="tempoFaderLocked()"
        (pointerdown)="bend(1)"
        (pointerup)="bend(0)"
        (pointercancel)="bend(0)"
      >
        +
      </button>
    </div>
    <span class="note">
      @if (pitchHint(); as hint) {
        {{ 'Pitch {change} to match' | t: { change: hint } }}
      } @else if (vinyl()) {
        {{ 'Driven by the turntable' | t }}
      }
    </span>
  </div>

  @if (mixer.internal()) {
    <app-channel-strip class="strip" [deck]="deck()" />
  }
</div>
