@if (!vinyl()) {
  <div class="transport">
    <button
      class="pr-btn pr-btn--lg key"
      [class.is-on]="cue() !== 'off'"
      [class.paused]="cue() === 'paused'"
      (press)="cueDown()"
      (release)="cueUp()"
    >
      CUE
    </button>
    <button
      class="pr-btn pr-btn--lg key"
      [class.is-on]="status()?.playing"
      (press)="engine.togglePlay(deck())"
    >
      {{ status()?.playing ? 'PAUSE' : 'PLAY' }}
    </button>
  </div>
}

@if (separation() === 'none') {
  <button
    class="pr-btn pr-btn--lg separate"
    [disabled]="!canSeparate()"
    (click)="separate()"
    [title]="'Separate this track into stems' | t"
  >
    <span>{{ 'Separate' | t }}</span>
    @if (separating() !== null) {
      <span class="pr-num">{{ percent(separating()!) }}</span>
      <i [style.--done]="separating()"></i>
    }
  </button>
} @else {
  <div class="stems">
    @for (k of stemKnobs(); track k.part) {
      <app-knob
        small
        [class.waiting]="k.waiting"
        [dimmed]="!k.on"
        [disabled]="!k.ready"
        [value]="k.level"
        [defaultValue]="1"
        [label]="k.label"
        [labelTitle]="k.title"
        [active]="!k.on"
        [readout]="percent(k.level)"
        (valueChange)="engine.setStemLevel(deck(), k.part, $event)"
        (labelClick)="engine.toggleStem(deck(), k.part)"
      />
    }
  </div>
  @if (resumable()) {
    <button
      class="pr-btn pr-btn--lg separate again"
      (click)="separate()"
      [title]="'Separate this track again: its separation stopped short' | t"
      [attr.aria-label]="'Separate' | t"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 15V9M8 9C8 6 3.5 6.5 3.5 2M8 9V2m0 7c0-3 4.5-2.5 4.5-7" />
      </svg>
      <span>{{ 'Separate' | t }}</span>
    </button>
  }
}

<button
  class="pr-btn pr-btn--lg key sync"
  [class.is-on]="syncState() === 'locked'"
  [class.matched]="syncState() === 'matched'"
  (press)="engine.press(deck(), 'sync')"
  (release)="engine.release(deck(), 'sync', $event)"
  [disabled]="!canSync()"
  [title]="syncTitle()"
>
  SYNC
</button>

@if (!vinyl()) {
  <div class="push">
    <button
      class="pr-btn pr-btn--lg"
      (press)="engine.press(deck(), 'push.slower')"
      (release)="engine.press(deck(), 'push.slower', false)"
      [title]="'Slower and slower while held, then backwards' | t"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3L3 8l5 5M13 3L8 8l5 5" /></svg>
    </button>
    <button
      class="pr-btn pr-btn--lg"
      (press)="engine.press(deck(), 'push.faster')"
      (release)="engine.press(deck(), 'push.faster', false)"
      [title]="'Faster and faster while held' | t"
    >
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3l5 5-5 5M3 3l5 5-5 5" /></svg>
    </button>
  </div>
}

<div class="pitch">
  <div class="line">
    <span
      class="value pr-num"
      (dblclick)="resetPitch()"
      [title]="vinyl() ? ('Pitch of the turntable' | t) : ('Double-click to reset' | t)"
      >{{ pitchText() }}</span
    >
    @if (vinyl()) {
      <span
        class="target pr-num"
        [class.unseen]="!pitchTarget()"
        [title]="'Pitch to set on the turntable to match' | t"
        >→ {{ pitchTarget() }}</span
      >
    }
  </div>
  <div class="line">
    <button
      class="pr-btn pr-btn--sm key-lock"
      [class.is-on]="settings().keyLock"
      (click)="engine.setKeyLock(deck(), !settings().keyLock)"
      [title]="'Key lock: the pitch stays when the tempo changes' | t"
    >
      KEY LOCK
    </button>
    <span
      class="pr-chip"
      [class.unseen]="!status()?.sync?.leader"
      [title]="'The other decks follow this one' | t"
      >LEADER</span
    >
  </div>
</div>
