<div class="controls" [style.--accent]="color()">
  <div class="transport">
    <button class="cue" [class.active]="status()?.playing === false && status()?.loaded" (click)="cue()" [disabled]="vinyl()">CUE</button>
    <button class="play" [class.active]="status()?.playing" (click)="togglePlay()" [disabled]="vinyl()">
      {{ status()?.playing ? 'PAUSE' : 'PLAY' }}
    </button>
    <button
      class="sync"
      [class.locked]="syncState() === 'locked'"
      [class.matched]="syncState() === 'matched'"
      (click)="sync()"
      [disabled]="!canSync()"
      [title]="syncTitle()"
    >
      SYNC
    </button>
  </div>

  <div class="tempo">
    <div class="tempo-head">
      <span class="label">TEMPO</span>
      @if (status()?.sync?.leader) {
        <span class="leader" title="The other decks follow this one">LEADER</span>
      }
      <span class="value" (dblclick)="resetPitch()" title="Double-click to reset">{{ pitchText() }}</span>
    </div>
    <input
      type="range"
      [min]="-range"
      [max]="range"
      step="0.0005"
      [value]="faderValue()"
      (input)="onPitch($event)"
      (dblclick)="resetPitch()"
      [disabled]="tempoFaderLocked()"
    />
    <div class="phase" [class.aligned]="aligned()" title="Beat offset from the other deck">
      @let offset = phase();
      @if (offset !== null) {
        <div class="marker" [style.left.%]="50 + offset * 100"></div>
      }
    </div>
  </div>

  @if (pitchHint(); as hint) {
    <div class="note">Pitch {{ hint }} to match</div>
  } @else if (vinyl()) {
    <div class="note">Driven by the turntable</div>
  }
</div>
