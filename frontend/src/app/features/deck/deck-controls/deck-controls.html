@if (!vinyl()) {
  <div class="transport">
    <button
      class="pr-btn pr-btn--lg key"
      [class.is-on]="status()?.playing === false && status()?.loaded"
      (pointerdown)="cueDown()"
      (pointerup)="cueUp()"
      (pointercancel)="cueUp()"
    >
      CUE
    </button>
    <button class="pr-btn pr-btn--lg key" [class.is-on]="status()?.playing" (click)="togglePlay()">
      {{ status()?.playing ? 'PAUSE' : 'PLAY' }}
    </button>
  </div>
}

@if (separation() === 'none') {
  <button
    class="pr-btn pr-btn--lg separate"
    [disabled]="!canSeparate()"
    (click)="separate()"
    [title]="'Separate this track into stems' | t"
  >
    <span>{{ 'Separate' | t }}</span>
    @if (separating() !== null) {
      <span class="pr-num">{{ percent(separating()!) }}</span>
      <i [style.--done]="separating()"></i>
    }
  </button>
} @else {
  <div class="stems">
    @for (k of stemKnobs(); track k.part) {
      <app-knob
        small
        [class.waiting]="k.waiting"
        [dimmed]="!k.on"
        [value]="k.level"
        [defaultValue]="1"
        [label]="k.label"
        [labelTitle]="k.title"
        [active]="!k.on"
        [format]="percent"
        (valueChange)="engine.setStemLevel(deck(), k.part, $event)"
        (labelClick)="engine.toggleStem(deck(), k.part)"
      />
    }
  </div>
}

<button
  class="pr-btn pr-btn--lg key sync"
  [class.is-on]="syncState() === 'locked'"
  [class.matched]="syncState() === 'matched'"
  (pointerdown)="syncDown($event)"
  (pointerup)="syncUp()"
  (pointercancel)="syncCancel()"
  (click)="syncKey($event)"
  [disabled]="!canSync()"
  [title]="syncTitle()"
>
  SYNC
</button>

<div class="pitch">
  <div class="line">
    <span
      class="value pr-num"
      (dblclick)="resetPitch()"
      [title]="vinyl() ? ('Pitch of the turntable' | t) : ('Double-click to reset' | t)"
      >{{ pitchText() }}</span
    >
    @if (pitchTarget(); as target) {
      <span class="target pr-num" [title]="'Pitch to set on the turntable to match' | t"
        >→ {{ target }}</span
      >
    }
    @if (status()?.sync?.leader) {
      <span class="pr-chip" [title]="'The other decks follow this one' | t">LEADER</span>
    }
  </div>
  <button
    class="pr-btn pr-btn--sm key-lock"
    [class.is-on]="settings().keyLock"
    (click)="engine.setKeyLock(deck(), !settings().keyLock)"
    [title]="'Key lock: the pitch stays when the tempo changes' | t"
  >
    KEY LOCK
  </button>
</div>
