<div class="waveform">
  <div
    class="zoom"
    (pointerdown)="press($event, 'zoom')"
    (pointermove)="move($event)"
    (pointerup)="release($event)"
    (pointercancel)="cancel()"
  >
    <canvas #zoom></canvas>
  </div>
  <div
    class="overview"
    (pointerdown)="press($event, 'overview')"
    (pointermove)="move($event)"
    (pointerup)="release($event)"
    (pointercancel)="cancel()"
  >
    <canvas #overview></canvas>
  </div>
  @if (!track()) {
    <div class="hint">{{ 'Load a track from the library' | t }}</div>
  }
</div>
