<div class="waveform">
  <div
    class="zoom"
    (pointerdown)="press($event, 'zoom')"
    (pointermove)="move($event)"
    (pointerup)="release($event)"
    (pointercancel)="cancelled($event)"
  >
    <canvas #zoom></canvas>
  </div>
  <div
    class="overview"
    (pointerdown)="press($event, 'overview')"
    (pointermove)="move($event)"
    (pointerup)="release($event)"
    (pointercancel)="cancelled($event)"
  >
    <canvas #overview></canvas>
  </div>
  @if (activity(); as activity) {
    <div
      class="lanes"
      [style.--lanes]="activity.length"
      [title]="lanesTitle()"
      (pointerdown)="press($event, 'overview')"
      (pointermove)="move($event)"
      (pointerup)="release($event)"
      (pointercancel)="cancelled($event)"
    >
      <canvas #lanes></canvas>
    </div>
  }
  @if (through(); as inputs) {
    <div class="through">
      <span class="tag">THRU</span>
      <span>{{ 'Plays inputs {inputs} as they come' | t: { inputs } }}</span>
    </div>
  } @else if (!track()) {
    <div class="hint">{{ 'Load a track from the library' | t }}</div>
  }
</div>
