<div class="backdrop" (click)="keyboard.helpOpen.set(false)">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h2>Keyboard shortcuts</h2>
    <div class="groups">
      @for (g of groups(); track g.name) {
        <section>
          <h3>{{ g.name }}</h3>
          @for (s of g.shortcuts; track s.description) {
            <div class="line">
              <kbd>{{ keyboard.label(s) }}</kbd>
              <span>{{ s.description }}</span>
            </div>
          }
        </section>
      }
    </div>
    <div class="buttons">
      <button (click)="keyboard.helpOpen.set(false)">Close</button>
    </div>
  </div>
</div>
