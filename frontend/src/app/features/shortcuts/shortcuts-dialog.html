<div class="backdrop" (click)="controls.helpOpen.set(false)">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h2>Keyboard shortcuts</h2>
    <div class="groups">
      @for (g of groups(); track g.name) {
        <section>
          <h3>{{ g.name }}</h3>
          @for (line of g.lines; track line.label) {
            <div class="line">
              <kbd>{{ line.key }}</kbd>
              <span>{{ line.label }}</span>
            </div>
          }
        </section>
      }
    </div>
    <div class="buttons">
      <button (click)="controls.helpOpen.set(false)">Close</button>
    </div>
  </div>
</div>
