<div class="pr-backdrop" (click)="controls.helpOpen.set(false)">
  <div
    class="pr-dialog"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="'Keyboard shortcuts' | t"
    (click)="$event.stopPropagation()"
  >
    <header class="pr-dialog__head">
      <h2>{{ 'Keyboard shortcuts' | t }}</h2>
      <button
        class="pr-btn pr-btn--ghost pr-btn--icon"
        [attr.aria-label]="'Close' | t"
        (click)="controls.helpOpen.set(false)"
      >
        ×
      </button>
    </header>
    <div class="pr-dialog__body groups">
      @for (g of groups(); track g.name) {
        <section>
          <h3>{{ g.name }}</h3>
          @for (line of g.lines; track line.label) {
            <div class="line">
              <kbd class="pr-kbd">{{ line.key }}</kbd>
              <span>{{ line.label }}</span>
            </div>
          }
        </section>
      }
    </div>
  </div>
</div>
