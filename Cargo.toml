[workspace]
resolver = "2"
members = ["crates/*", "apps/prisme-cli", "apps/prisme-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
prisme-timecode = { path = "crates/prisme-timecode" }
prisme-media = { path = "crates/prisme-media" }
prisme-engine = { path = "crates/prisme-engine" }
prisme-audio-io = { path = "crates/prisme-audio-io" }
prisme-analysis = { path = "crates/prisme-analysis" }
prisme-library = { path = "crates/prisme-library" }
prisme-session = { path = "crates/prisme-session" }
prisme-import = { path = "crates/prisme-import" }

anyhow = "1"
thiserror = "2"
rtrb = "0.3"
triple_buffer = "8"
cpal = "0.18"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading"] }
clap = { version = "4", features = ["derive"] }
lofty = "0.25"
percent-encoding = "2"
notify = "8"
base64 = "0.22"
quick-xml = "0.38"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "ogg", "vorbis", "wav", "pcm", "alac"] }

[profile.release]
debug = 1

# The decoder and the engine run sample by sample: keep them optimized in test builds too.
[profile.test]
opt-level = 2
[profile.dev.package."*"]
opt-level = 2
# the DSP crates are unusably slow unoptimised, even while developing the UI
[profile.dev.package.prisme-analysis]
opt-level = 2
[profile.dev.package.prisme-media]
opt-level = 2
