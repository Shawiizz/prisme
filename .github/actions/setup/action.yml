name: Setup
description: Rust, Node and pnpm, the frontend packages, and what each system needs to build

runs:
  using: composite
  steps:
    - name: Rust (the version of rust-toolchain.toml)
      shell: pwsh
      run: rustup toolchain install
    - uses: Swatinem/rust-cache@v2
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: frontend/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
    - name: Linux libraries (the web view, ALSA and JACK)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev \
          libayatana-appindicator3-dev librsvg2-dev libasound2-dev libjack-jackd2-dev libudev-dev
    - name: Development tools
      if: runner.os != 'Windows'
      shell: bash
      run: ./scripts/setup-dev.sh
    - name: Development tools
      if: runner.os == 'Windows'
      shell: pwsh
      run: ./scripts/setup-dev.ps1
    - name: Resource compiler
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $rc = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe" | Sort-Object FullName | Select-Object -Last 1
        "RC=$($rc.FullName)" >> $env:GITHUB_ENV