name: Android

# The signed APK: for a release, attached to it by the Release workflow; on demand, as an
# artifact of the run.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        description: Tag of the release the APK is attached to
        type: string

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The app version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "prisme-desktop") | .version')
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: The NDK of the project, and Rust for the phones' processors
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          clang=$(ls "$toolchain/lib/clang" | head -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$toolchain/sysroot -isystem $toolchain/lib/clang/$clang/include" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: The release key (kept out of the repository)
        working-directory: apps/prisme-desktop/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$ALIAS"
            echo "password=$PASSWORD"
          } > keystore.properties
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: APK
        working-directory: apps/prisme-desktop
        run: |
          # the version Android shows and compares, else 1.0 for every release
          cargo tauri android build --apk --target aarch64 --config "{\"version\":\"$VERSION\"}"
          apk=gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/Prisme-${VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out
      - name: Attached to the release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/*.apk --clobber
