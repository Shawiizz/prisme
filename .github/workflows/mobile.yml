name: Mobile

# The phone builds, while they are being made: compiles Prisme for iOS, starts it in the
# iPhone simulator, and keeps a screenshot, the logs and the Xcode project it generated.
on:
  workflow_dispatch:
  push:
    branches: [mobile]

jobs:
  ios:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Rust for the iPhone and its simulator
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: The headers of the simulator, for the bindings
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          compiler=$(xcrun clang -print-resource-dir)/include
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=-isysroot $sdk -isystem $compiler" >> "$GITHUB_ENV"
      - name: Frontend build
        working-directory: frontend
        run: pnpm build
      - name: Check
        run: cargo check -p prisme-desktop --target "$TARGET"
      # as a cargo command: the Xcode project calls it back the way it was called
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Xcode project
        if: always()
        working-directory: apps/prisme-desktop
        run: |
          brew install xcodegen libimobiledevice
          cargo tauri ios init
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-project
          path: apps/prisme-desktop/gen/apple
      - name: Build for the simulator
        working-directory: apps/prisme-desktop
        # the archive that follows the build needs a signing team: the build is what is started
        run: cargo tauri ios build --debug --target aarch64-sim || echo "not archived"
      - name: Start in the simulator
        run: |
          mkdir -p start
          app=$(find apps/prisme-desktop/gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -path "*simulator*" 2>/dev/null | head -1)
          echo "app: $app"
          phone=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [^(]+\(([0-9A-F-]{36})\)" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          # signed for this machine only: the simulator refuses to open an application that is not
          codesign --force --deep --sign - "$app"
          xcrun simctl install "$phone" "$app"
          # the home screen takes a moment to accept applications after the boot
          for attempt in 1 2 3 4; do
            sleep 20
            xcrun simctl launch --stdout="$PWD/start/output.log" --stderr="$PWD/start/errors.log" "$phone" com.shawiizz.prisme && break
          done
          sleep 20
          xcrun simctl io "$phone" screenshot start/early.png
          sleep 40
          xcrun simctl io "$phone" screenshot start/screen.png
          # what Prisme wrote: its own log files, and what it said
          data=$(xcrun simctl get_app_container "$phone" com.shawiizz.prisme data)
          find "$data" -name "*.log" -exec cp {} start/ \; || true
          tail -n 40 start/*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-ios
          path: start
