name: Mobile

# The phone builds: a mobile version tag (mobile-1.2.3), apart from the computers' tags, or on
# demand. Android: the signed APK, attached to a draft release for a tag (publishing it offers
# the download). iOS: only checked, compiled and started in the iPhone simulator, with a
# screenshot, the logs and the Xcode project it generated (an App Store release needs Apple's
# paid membership).
on:
  workflow_dispatch:
  push:
    tags: ["mobile-[0-9]+.[0-9]+.[0-9]+"]

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: The tag is the app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "prisme-desktop") | .version')
          [ "mobile-$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, app version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: The NDK of the project, and Rust for the phones' processors
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          toolchain="$ndk/toolchains/llvm/prebuilt/linux-x86_64"
          clang=$(ls "$toolchain/lib/clang" | head -1)
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$toolchain/sysroot -isystem $toolchain/lib/clang/$clang/include" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: The release key (kept out of the repository)
        working-directory: apps/prisme-desktop/gen/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "keyAlias=$ALIAS"
            echo "password=$PASSWORD"
          } > keystore.properties
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: APK
        working-directory: apps/prisme-desktop
        run: |
          cargo tauri android build --apk true --target aarch64
          apk=gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify "$apk"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$apk" "$RUNNER_TEMP/out/Prisme_${VERSION:-$GITHUB_SHA}_android-arm64.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/out
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Prisme mobile $VERSION" --notes ""
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/out/*.apk --clobber

  ios:
    runs-on: macos-latest
    env:
      TARGET: aarch64-apple-ios-sim
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Rust for the iPhone and its simulator
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: The headers of the simulator, for the bindings
        run: |
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          compiler=$(xcrun clang -print-resource-dir)/include
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios_sim=-isysroot $sdk -isystem $compiler" >> "$GITHUB_ENV"
      - name: Frontend build
        working-directory: frontend
        run: pnpm build
      - name: Check
        run: cargo check -p prisme-desktop --target "$TARGET"
      # as a cargo command: the Xcode project calls it back the way it was called
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2.12.2
      - name: Xcode project
        if: always()
        working-directory: apps/prisme-desktop
        run: |
          brew install xcodegen libimobiledevice
          cargo tauri ios init
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcode-project
          path: apps/prisme-desktop/gen/apple
      - name: Build for the simulator
        working-directory: apps/prisme-desktop
        # the archive that follows the build needs a signing team: the build is what is started
        run: cargo tauri ios build --debug --target aarch64-sim || echo "not archived"
      - name: Start in the simulator
        run: |
          mkdir -p start
          app=$(find apps/prisme-desktop/gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -path "*simulator*" 2>/dev/null | head -1)
          echo "app: $app"
          phone=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [^(]+\(([0-9A-F-]{36})\)" | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$phone"
          xcrun simctl bootstatus "$phone" -b
          # signed for this machine only: the simulator refuses to open an application that is not
          codesign --force --deep --sign - "$app"
          xcrun simctl install "$phone" "$app"
          # the home screen takes a moment to accept applications after the boot
          for attempt in 1 2 3 4; do
            sleep 20
            xcrun simctl launch --stdout="$PWD/start/output.log" --stderr="$PWD/start/errors.log" "$phone" com.shawiizz.prisme && break
          done
          sleep 20
          xcrun simctl io "$phone" screenshot start/early.png
          sleep 40
          xcrun simctl io "$phone" screenshot start/screen.png
          # what Prisme wrote: its own log files, and what it said
          data=$(xcrun simctl get_app_container "$phone" com.shawiizz.prisme data)
          find "$data" -name "*.log" -exec cp {} start/ \; || true
          tail -n 40 start/*.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: start-ios
          path: start
