name: Release

# A version tag (1.2.3) builds the packages of the three systems and the Android APK, side
# by side, then the update manifest from the computers' signatures, and attaches them to a
# draft release: publishing it offers the update to the installed copies.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app version
        shell: pwsh
        run: |
          rustup toolchain install
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'prisme-desktop' }).version
          if ($version -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }}, app version $version" }
      # tauri-action attaches to this draft: creating the release itself was refused once
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Prisme $TAG (alpha)" --notes ""

  packages:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # the oldest Ubuntu there is: a build runs on the systems as old as the one it was made on
          - os: ubuntu-22.04
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Both processors of the Macs
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/prisme-desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.2
          # signed update packages: only here, where the signing key is
          args: --config tauri.release.conf.json ${{ matrix.args }}
      # the packages under Prisme's names (docs/STANDARDS.md), each with its signature
      - name: The packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          out=packages
          mkdir -p "$out"
          put() {
            cp "$1" "$out/$2"
            if [ -f "$1.sig" ]; then cp "$1.sig" "$out/$2.sig"; fi
          }
          case "$RUNNER_OS" in
            Windows)
              put target/release/bundle/nsis/*-setup.exe "Prisme-$TAG-windows-x64-update.exe" ;;
            Linux)
              put target/release/bundle/appimage/*.AppImage "Prisme-$TAG-linux-x64.AppImage"
              put target/release/bundle/deb/*.deb "Prisme-$TAG-linux-x64.deb" ;;
            macOS)
              bundle=target/universal-apple-darwin/release/bundle
              put "$bundle"/dmg/*.dmg "Prisme-$TAG-macos-universal.dmg"
              put "$bundle"/macos/*.app.tar.gz "Prisme-$TAG-macos-universal-update.tar.gz" ;;
          esac
          gh release upload "$TAG" "$out"/* --clobber
      # what people download on Windows: Prisme's own window over the NSIS installer, which
      # the updates keep running without one
      - name: The Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $env:PRISME_SETUP_PAYLOAD = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          cargo build --release -p prisme-setup
          $installer = "Prisme-${env:TAG}-windows-x64.exe"
          Copy-Item target/release/prisme-setup.exe $installer
          gh release upload $env:TAG $installer --clobber

  android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      release: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write

  manifest:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          python3 scripts/update-manifest.py "$TAG" "${{ github.repository }}" signatures > latest.json
          gh release upload "$TAG" latest.json --clobber
