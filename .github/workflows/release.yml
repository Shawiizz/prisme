name: Release

# A version tag (1.2.3) builds the packages of the three systems and the signed update
# manifest and attaches them to a draft release: publishing it offers the update to the
# installed copies.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app version
        shell: pwsh
        run: |
          rustup toolchain install
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'prisme-desktop' }).version
          if ($version -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }}, app version $version" }
      # tauri-action attaches to this draft: creating the release itself was refused once
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Prisme $TAG" --notes ""

  packages:
    needs: draft
    strategy:
      fail-fast: false
      # one after the other: each adds its system to the same update manifest
      max-parallel: 1
      matrix:
        include:
          - os: windows-latest
          # the oldest Ubuntu there is: a build runs on the systems as old as the one it was made on
          - os: ubuntu-22.04
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Both processors of the Macs
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/prisme-desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.2
          tagName: ${{ github.ref_name }}
          releaseName: Prisme ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: true
          # signed update packages: only here, where the signing key is
          args: --config tauri.release.conf.json ${{ matrix.args }}
