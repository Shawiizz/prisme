name: Release

# A tag v1.2.3 builds the Windows installer and attaches it to a draft release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build the installer
        working-directory: apps/prisme-desktop
        run: ../../frontend/node_modules/.bin/tauri build
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: target/release/bundle/nsis/*.exe