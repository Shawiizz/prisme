name: Release

# A version tag (1.2.3) builds the packages of the three systems and the Android APK, side
# by side, then the update manifest from the computers' signatures, and attaches them to a
# draft release: publishing it offers the update to the installed copies.
on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the app version
        shell: pwsh
        run: |
          rustup toolchain install
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages.Where({ $_.name -eq 'prisme-desktop' }).version
          if ($version -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }}, app version $version" }
      # tauri-action attaches to this draft: creating the release itself was refused once
      - name: Draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --verify-tag --title "Prisme $TAG (alpha)" --notes ""

  packages:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          # the oldest Ubuntu there is: a build runs on the systems as old as the one it was made on
          - os: ubuntu-22.04
          - os: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Both processors of the Macs
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: tauri-apps/tauri-action@v0
        if: runner.os != 'Windows'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/prisme-desktop
          tauriScript: npx --yes @tauri-apps/cli@2.12.2
          args: ${{ matrix.args }}
      # Windows: Prisme alone, packed and signed for the copies that update themselves, then
      # carried by Prisme's own installer, which the versions before 0.7 run as their update
      - name: Prisme for Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tauri="npx --yes @tauri-apps/cli@2.12.2"
          (cd apps/prisme-desktop && $tauri build --no-bundle)
          mkdir -p packages
          update="packages/Prisme-$TAG-windows-x64-update.tar.gz"
          tar -czf "$update" -C target/release prisme-desktop.exe
          curl -fsSL -o webview2.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"
          PRISME_SETUP_PAYLOAD="$PWD/$update" PRISME_SETUP_WEBVIEW2="$PWD/webview2.exe" \
            cargo build --release -p prisme-setup
          cp target/release/prisme-setup.exe "packages/Prisme-$TAG-windows-x64.exe"
          for package in packages/*; do $tauri signer sign "$package"; done
      # the packages under Prisme's names (docs/STANDARDS.md), those the copies update from
      # signed with the releases' key: on a Mac the application packed, on Linux the AppImage
      # and the .deb themselves
      - name: The packages
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          out=packages
          mkdir -p "$out"
          sign() {
            for package in "$@"; do npx --yes @tauri-apps/cli@2.12.2 signer sign "$package"; done
          }
          case "$RUNNER_OS" in
            Linux)
              cp target/release/bundle/appimage/*.AppImage "$out/Prisme-$TAG-linux-x64.AppImage"
              cp target/release/bundle/deb/*.deb "$out/Prisme-$TAG-linux-x64.deb"
              sign "$out/Prisme-$TAG-linux-x64.AppImage" "$out/Prisme-$TAG-linux-x64.deb" ;;
            macOS)
              bundle=target/universal-apple-darwin/release/bundle
              cp "$bundle"/dmg/*.dmg "$out/Prisme-$TAG-macos-universal.dmg"
              # the bundle at the top of the archive, without the Finder's own files
              app=$(basename "$bundle"/macos/*.app)
              COPYFILE_DISABLE=1 tar -czf "$out/Prisme-$TAG-macos-universal-update.tar.gz"                 -C "$bundle/macos" "$app"
              sign "$out/Prisme-$TAG-macos-universal-update.tar.gz" ;;
          esac
          gh release upload "$TAG" "$out"/* --clobber

  android:
    needs: draft
    uses: ./.github/workflows/android.yml
    with:
      release: ${{ github.ref_name }}
    secrets: inherit
    permissions:
      contents: write

  manifest:
    needs: packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --pattern '*.sig' --dir signatures
          python3 scripts/update-manifest.py "$TAG" "${{ github.repository }}" signatures > latest.json
          gh release upload "$TAG" latest.json --clobber
