name: CI

on:
  push:
    branches: [main]
    # the website and the docs alone
    paths-ignore:
      - website/**
      - docs/**
      - README.md
      - .github/workflows/website.yml
  pull_request:
    paths-ignore:
      - website/**
      - docs/**
      - README.md
      - .github/workflows/website.yml
  workflow_dispatch:

# a new push cancels the checks still running for the one before it (on a pull request, its own)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # about 20 minutes on Windows, where the GPU tests run on the software renderer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # the frontend first: the application embeds it
      - name: Frontend format
        working-directory: frontend
        run: pnpm exec prettier --check src
      - name: Frontend tests
        working-directory: frontend
        run: pnpm exec ng test --watch=false
      - name: Frontend build
        working-directory: frontend
        run: pnpm build
      - name: Rust format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace